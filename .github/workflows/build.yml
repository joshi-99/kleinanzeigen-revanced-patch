name: Build Kleinanzeigen ReVanced Patch V3

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone official ReVanced patches
        run: |
          git clone --depth 1 https://gitlab.com/ReVanced/revanced-patches.git revanced-patches

      - name: Install experimental Kleinanzeigen matcher
        working-directory: revanced-patches
        run: |
          python3 -c 'import base64, pathlib; p=pathlib.Path("patches/src/main/kotlin/app/revanced/patches/kleinanzeigen/ads/Fingerprints.kt"); p.write_bytes(base64.b64decode(""))'
          python3 -c 'import base64, pathlib; p=pathlib.Path("patches/src/main/kotlin/app/revanced/patches/kleinanzeigen/ads/HideAdsPatch.kt"); p.write_bytes(base64.b64decode(""))'
          python3 -c 'from pathlib import Path; p=Path("patches/build.gradle.kts"); t=p.read_text(); t=t.replace("name = \"ReVanced Patches\"", "name = \"Kleinanzeigen Experimental Patches\""); p.write_text(t)'
          python3 -c 'from pathlib import Path; p=Path("gradle.properties"); t=p.read_text(); t=t.replace("version = 6.1.0", "version = 6.1.0-ka-v3"); p.write_text(t)'

      - name: Verify experimental source
        working-directory: revanced-patches
        run: |
          echo "===== Fingerprints.kt ====="
          cat patches/src/main/kotlin/app/revanced/patches/kleinanzeigen/ads/Fingerprints.kt
          echo "===== HideAdsPatch.kt ====="
          cat patches/src/main/kotlin/app/revanced/patches/kleinanzeigen/ads/HideAdsPatch.kt
          echo "===== Bundle identity ====="
          grep -n "name =" patches/build.gradle.kts | head
          grep -n "^version" gradle.properties

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android patch bundle
        working-directory: revanced-patches
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid

      - name: Show generated files
        working-directory: revanced-patches
        run: |
          find patches/build/libs -maxdepth 1 -type f -print

      - name: Upload RVP
        uses: actions/upload-artifact@v4
        with:
          name: kleinanzeigen-revanced-experimental-v3
          path: revanced-patches/patches/build/libs/*.rvp
